[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "carsec"
version = "0.2.0"
description = "Automotive CAN bus security research platform — SecOC, intrusion detection, UDS, and attack simulation"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Je1al" }]
keywords = [
    "automotive-security",
    "can-bus",
    "secoc",
    "autosar",
    "iso21434",
    "intrusion-detection",
    "uds",
    "iso14229",
    "ecu",
    "cybersecurity",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: System :: Hardware",
]
# Core simulator runs on the Python standard library only.
dependencies = []

[project.optional-dependencies]
# Charts / reports
viz = ["matplotlib>=3.5"]
# Real / virtual CAN hardware (SocketCAN) and DBC signal databases
hardware = ["python-can>=4.0", "cantools>=39.0"]
# Development tooling
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "mypy>=1.8",
]
all = ["carsec[viz,hardware,dev]"]

[project.urls]
Homepage = "https://github.com/Je1al/car-security-simulator"
Issues = "https://github.com/Je1al/car-security-simulator/issues"

[project.scripts]
carsec = "carsec.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]  # long lines tolerated in didactic docstrings/tables

[tool.mypy]
python_version = "3.9"
warn_unused_ignores = true
ignore_missing_imports = true
files = ["src/carsec"]
